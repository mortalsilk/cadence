[package]
name = "cadence"
version = "0.2.1"
description = "Local stint and session tracker"
authors = ["cadence contributors"]
edition = "2021"

[lib]
name = "cadence_core"

[[bin]]
name = "cadence"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-notification", "dep:tauri-plugin-dialog", "dep:zbus"]

[build-dependencies]
tauri-build = { version = "2", optional = true, features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
csv = "1"
tauri = { version = "2", optional = true, features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
zbus = { version = "5", optional = true }
